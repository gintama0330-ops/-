<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きょうのきぶんルーム</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(#ffeef5,#f3e8ff);
  text-align:center;
}

.card{
  margin:40px auto;
  padding:20px;
  width:90%;
  max-width:400px;
  background:white;
  border-radius:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  color:#8b5cf6;
}

.character{
  font-size:70px;
  cursor:pointer;
  margin:20px 0;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:20px;
  background:#f9a8d4;
  color:white;
  font-size:16px;
}

.star{
  color:#fbbf24;
  font-size:24px;
}
</style>
</head>

<body>

<div class="card">

<h1>きょうのきぶんルーム</h1>

<p id="date"></p>

<div id="fortune"></div>

<div class="character" onclick="changeCharacter()" id="chara">🐰</div>

<p id="msg">ボタンを押してね</p>

<button onclick="show()">きょうのメッセージ</button>

</div>

<script>
const chars = ["🐰","🐻","🐱","🐶","🐹"];
const messages = [
"今日はゆっくりでOK 🌷",
"ちょっとでも進めばえらい 💖",
"無理しないのが一番 ☁️",
"自分に優しくしていい日 🎀",
"だらだらしてもOK 🍰"
];

let index=0;

function changeCharacter(){
  index = (index+1)%chars.length;
  document.getElementById("chara").innerText = chars[index];
}

function show(){
  const m = messages[Math.floor(Math.random()*messages.length)];
  document.getElementById("msg").innerText = m;
}

function init(){
  const today = new Date();
  const day = today.getDate();

  document.getElementById("date").innerText =
    `${today.getMonth()+1}月${day}日`;

  // 運勢（1〜3）
  const luck = (day % 3) + 1;

  let stars="";
  for(let i=0;i<luck;i++){
    stars += "⭐";
  }

  document.getElementById("fortune").innerHTML =
    `今日の運勢：<span class="star">${stars}</span>`;
}

init();
</script>

</body>
</html>
