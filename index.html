<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>きょうのきぶんルーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ffdff0;
      --bg2:#efe2ff;
      --bg3:#dff3ff;
      --card:#fff9fdcc;
      --line:#ffffff;
      --text:#7b5c8f;
      --sub:#a587b8;
      --pink:#ff8fc5;
      --pink2:#ffb8db;
      --purple:#c7a4ff;
      --blue:#b8e5ff;
      --yellow:#ffe596;
      --mint:#ccf8e3;
      --shadow:0 20px 45px rgba(210,145,192,.22);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:"Zen Maru Gothic", system-ui, sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,184,219,.75), transparent 18%),
        radial-gradient(circle at 88% 15%, rgba(184,229,255,.9), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(204,248,227,.75), transparent 18%),
        linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    }

    body{
      display:grid;
      place-items:center;
      padding:24px 14px 40px;
    }

    .floaters{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .floater{
      position:absolute;
      bottom:-12vh;
      opacity:.84;
      font-size:clamp(18px,3vw,30px);
      animation:up linear infinite;
      filter:drop-shadow(0 6px 8px rgba(255,255,255,.4));
      user-select:none;
    }

    @keyframes up{
      0%{transform:translateY(0) rotate(0deg);opacity:0}
      10%{opacity:.9}
      100%{transform:translateY(-118vh) rotate(16deg);opacity:0}
    }

    .app{
      position:relative;
      z-index:1;
      width:min(94vw, 470px);
    }

    .hero-pill{
      width:100%;
      background:linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,246,252,.92));
      border:3px solid rgba(255,255,255,.95);
      border-radius:999px;
      box-shadow:var(--shadow);
      padding:14px 18px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }

    .hero-pill .tiny{
      font-size:20px;
      line-height:1;
    }

    .hero-pill .title{
      font-family:"Mochiy Pop One", sans-serif;
      color:#ab78d9;
      font-size:clamp(20px,4.8vw,28px);
      letter-spacing:.02em;
    }

    .card{
      position:relative;
      background:var(--card);
      backdrop-filter:blur(14px);
      border:3px solid rgba(255,255,255,.9);
      border-radius:34px;
      box-shadow:var(--shadow);
      padding:18px 18px 22px;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:auto -40px -55px auto;
      width:170px;
      height:170px;
      background:radial-gradient(circle, rgba(255,184,219,.35), transparent 65%);
      pointer-events:none;
    }

    .card::after{
      content:"";
      position:absolute;
      inset:-30px auto auto -30px;
      width:130px;
      height:130px;
      background:radial-gradient(circle, rgba(184,229,255,.35), transparent 70%);
      pointer-events:none;
    }

    .datebar{
      background:linear-gradient(135deg,#fff4b9,#ffd6e8);
      border:2px solid rgba(255,255,255,.9);
      border-radius:999px;
      padding:10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      box-shadow:0 8px 18px rgba(255,214,232,.32);
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .date{
      font-size:13px;
      color:#8a6f99;
      font-weight:700;
    }

    .fortune{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      font-weight:700;
      color:#8a6f99;
    }

    .stars{
      color:#ffbc1f;
      letter-spacing:2px;
      font-size:18px;
      text-shadow:0 2px 0 rgba(255,255,255,.7);
    }

    .stage{
      position:relative;
      background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.42));
      border:2px dashed rgba(255,182,211,.9);
      border-radius:28px;
      padding:18px 14px 14px;
      text-align:center;
      box-shadow:inset 0 0 0 6px rgba(255,255,255,.25);
    }

    .spark-line{
      font-size:19px;
      letter-spacing:7px;
      color:#ff9fcf;
      margin-bottom:10px;
      opacity:.92;
    }

    .character-wrap{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap:10px;
      min-height:170px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .character{
      width:104px;
      height:118px;
      position:relative;
      border-radius:48px 48px 42px 42px;
      background:linear-gradient(180deg, #fff8fc, #ffdce9);
      border:3px solid rgba(255,255,255,.95);
      box-shadow:0 12px 22px rgba(224,165,197,.22);
      animation:bob 3s ease-in-out infinite;
      cursor:pointer;
      user-select:none;
      transition:transform .2s ease;
    }

    .character:hover{transform:translateY(-3px)}

    .character.bear{
      background:linear-gradient(180deg,#fff6fb,#ffd8e8);
    }

    .character.rabbit{
      background:linear-gradient(180deg,#fff8ff,#f6e2ff);
    }

    .character.cat{
      background:linear-gradient(180deg,#f9fcff,#dff1ff);
    }

    .character::before,
    .character::after{
      content:"";
      position:absolute;
      width:34px;
      height:34px;
      top:-10px;
      background:inherit;
      border:3px solid rgba(255,255,255,.95);
      border-radius:50%;
    }

    .bear::before{left:8px}
    .bear::after{right:8px}

    .cat::before,
    .cat::after{
      width:28px;height:28px;top:-9px;border-radius:8px 18px 8px 18px;
    }
    .cat::before{left:12px;transform:rotate(-28deg)}
    .cat::after{right:12px;transform:rotate(28deg)}

    .rabbit::before,
    .rabbit::after{
      width:24px;height:52px;top:-30px;border-radius:20px 20px 12px 12px;
    }
    .rabbit::before{left:20px;transform:rotate(-12deg)}
    .rabbit::after{right:20px;transform:rotate(12deg)}

    .face{
      position:absolute;
      inset:0;
    }

    .eye{
      position:absolute;
      width:10px;
      height:14px;
      background:#6f5c79;
      border-radius:50%;
      top:44px;
    }

    .eye.left{left:31px}
    .eye.right{right:31px}

    .blush{
      position:absolute;
      width:18px;
      height:10px;
      background:rgba(255,148,180,.42);
      border-radius:50%;
      top:62px;
      filter:blur(.2px);
    }

    .blush.left{left:18px}
    .blush.right{right:18px}

    .mouth{
      position:absolute;
      left:50%;
      top:63px;
      width:18px;
      height:10px;
      transform:translateX(-50%);
      border-bottom:3px solid #7b647c;
      border-radius:0 0 18px 18px;
    }

    .tiny-paw{
      position:absolute;
      bottom:10px;
      width:18px;height:14px;
      background:rgba(255,255,255,.55);
      border-radius:50%;
    }

    .tiny-paw.left{left:24px}
    .tiny-paw.right{right:24px}

    @keyframes bob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-7px)}
    }

    .name-row{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .chip{
      border:none;
      background:rgba(255,255,255,.86);
      border:2px solid rgba(255,255,255,.95);
      color:#9c78b7;
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      font-weight:700;
      box-shadow:0 6px 14px rgba(217,174,216,.18);
      cursor:pointer;
      transition:.2s ease;
    }

    .chip.active{
      background:linear-gradient(135deg,#ffb7db,#d8b7ff);
      color:#fff;
    }

    .message{
      min-height:94px;
      display:grid;
      place-items:center;
      padding:14px 12px;
      background:rgba(255,255,255,.72);
      border:2px solid rgba(255,255,255,.9);
      border-radius:24px;
      color:#7b5d8c;
      line-height:1.9;
      font-size:16px;
      margin:10px 0 14px;
    }

    .main-btn{
      width:100%;
      border:none;
      border-radius:999px;
      padding:15px 18px;
      background:linear-gradient(135deg,var(--pink),var(--purple));
      color:#fff;
      font-size:16px;
      font-weight:700;
      font-family:inherit;
      box-shadow:0 12px 22px rgba(214,140,206,.32);
      cursor:pointer;
      transition:.18s ease;
    }

    .main-btn:hover{transform:translateY(-2px) scale(1.01);filter:brightness(1.03)}
    .main-btn:active{transform:scale(.98)}

    .subtext{
      margin-top:13px;
      text-align:center;
      font-size:12px;
      line-height:1.7;
      color:var(--sub);
    }

    .mini-deco{
      margin-top:8px;
      text-align:center;
      font-size:18px;
      letter-spacing:4px;
      color:#ff98c3;
    }

    @media (max-width:460px){
      .character-wrap{gap:8px}
      .character{width:92px;height:108px}
      .eye{top:40px}
      .mouth{top:59px}
      .message{font-size:15px}
    }
  </style>
</head>
<body>
  <div class="floaters" id="floaters"></div>

  <main class="app">
    <div class="hero-pill">
      <span class="tiny">🎀</span>
      <div class="title">きょうのきぶんルーム</div>
      <span class="tiny">✨</span>
    </div>

    <section class="card">
      <div class="datebar">
        <div class="date" id="dateText">2026年4月19日（日）</div>
        <div class="fortune">
          <span>きょうの運勢</span>
          <span class="stars" id="starText">⭐⭐</span>
        </div>
      </div>

      <div class="stage">
        <div class="spark-line">✦ ⋆ ୨୧ ˚ ✦</div>

        <div class="character-wrap">
          <div class="character bear" data-name="もこくま">
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
              <div class="tiny-paw left"></div>
              <div class="tiny-paw right"></div>
            </div>
          </div>

          <div class="character rabbit" data-name="みるうさ">
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
              <div class="tiny-paw left"></div>
              <div class="tiny-paw right"></div>
            </div>
          </div>

          <div class="character cat" data-name="そらねこ">
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
              <div class="tiny-paw left"></div>
              <div class="tiny-paw right"></div>
            </div>
          </div>
        </div>

        <div class="name-row">
          <button class="chip active" data-char="0">もこくま</button>
          <button class="chip" data-char="1">みるうさ</button>
          <button class="chip" data-char="2">そらねこ</button>
        </div>

        <div class="message" id="message">
          こんにちは〜！<br>
          今日はどんな気分かな？ 💭
        </div>

        <button class="main-btn" id="mainBtn">きょうのメッセージをみる</button>
      </div>

      <div class="mini-deco">💖 ⭐ ☁️ 🎀</div>
      <div class="subtext">
        きょうは「がんばる」より<br>
        「かわいく生きる」を優先してよし
      </div>
    </section>
  </main>

  <script>
    const floaters = document.getElementById('floaters');
    const floaterIcons = ['✨','💖','⭐','☁️','🎀','🫧'];
    for(let i=0;i<26;i++){
      const el = document.createElement('div');
      el.className = 'floater';
      el.textContent = floaterIcons[Math.floor(Math.random()*floaterIcons.length)];
      el.style.left = (Math.random()*100) + '%';
      el.style.animationDuration = (8 + Math.random()*10) + 's';
      el.style.animationDelay = (Math.random()*8) + 's';
      el.style.fontSize = (18 + Math.random()*14) + 'px';
      floaters.appendChild(el);
    }

    const charMessages = {
      0: [
        'もこくまからひとこと🧸<br>今日はあせらなくてだいじょうぶ。',
        'もこくまより💖<br>ちょっと休みつつ進めば100点だよ。',
        'もこくまとまったり☁️<br>自分にやさしい予定でいこう。'
      ],
      1: [
        'みるうさより🎀<br>今日はふわっと可愛く過ごせば勝ち。',
        'みるうさからの運気🌷<br>小さなごほうびをあげてね。',
        'みるうさより✨<br>ゆっくりでも前に進んでるよ。'
      ],
      2: [
        'そらねこより⭐<br>今日は気分で選んでもいい日かも。',
        'そらねこから🫧<br>なんか違う、の感覚を大事にしてね。',
        'そらねこより☁️<br>無理に元気じゃなくても大丈夫。'
      ]
    };

    let activeChar = 0;
    const chips = [...document.querySelectorAll('.chip')];
    const characters = [...document.querySelectorAll('.character')];
    const messageEl = document.getElementById('message');

    function setCharacter(index){
      activeChar = index;
      chips.forEach((chip,i)=>chip.classList.toggle('active', i===index));
      characters.forEach((char,i)=>{
        char.style.transform = i===index ? 'translateY(-5px) scale(1.04)' : '';
        char.style.filter = i===index ? 'drop-shadow(0 10px 18px rgba(255,173,205,.35))' : '';
      });
    }

    chips.forEach((chip,i)=> chip.addEventListener('click', ()=> setCharacter(i)));
    characters.forEach((char,i)=> char.addEventListener('click', ()=> setCharacter(i)));

    document.getElementById('mainBtn').addEventListener('click', ()=>{
      const arr = charMessages[activeChar];
      const text = arr[Math.floor(Math.random()*arr.length)];
      messageEl.innerHTML = text;
    });

    const dateEl = document.getElementById('dateText');
    const starEl = document.getElementById('starText');
    const today = new Date();

    const weekdays = ['日','月','火','水','木','金','土'];
    dateEl.textContent = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日（${weekdays[today.getDay()]}）`;

    const stars = (today.getDate() % 3) + 1;
    starEl.textContent = '⭐'.repeat(stars);

    setCharacter(0);
  </script>
</body>
</html>
