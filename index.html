<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>動画変換アプリ Lite v3</title>
  <style>
    :root{
      --bg:#06070b; --card:#141822; --text:#f5f7fb; --muted:#aab3c5;
      --accent:#52a8ff; --ok:#35c759; --warn:#ffb020; --err:#ff6b6b;
      --border:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#07080d 0%,#0c0f16 100%);
      color:var(--text); min-height:100vh; padding:24px 16px 40px;
    }
    .wrap{max-width:820px;margin:0 auto}
    .card{
      background:rgba(20,24,34,.96); border:1px solid var(--border);
      border-radius:22px; padding:18px; margin-bottom:16px;
      box-shadow:0 12px 40px rgba(0,0,0,.28);
    }
    h1{margin:0 0 10px;font-size:32px;line-height:1.12;letter-spacing:.02em}
    h2{margin:0 0 12px;font-size:18px}
    p,li,label,small{color:var(--muted)}
    .hero{padding:24px 18px}
    .hero p{margin:8px 0 0}
    .btn{
      width:100%; border:none; border-radius:18px; padding:16px 18px;
      font-size:22px; font-weight:700; background:#e9edf5; color:#268bff;
      margin-top:12px; -webkit-appearance:none; appearance:none;
    }
    .btn:disabled{opacity:.55}
    .btn.secondary{
      background:linear-gradient(135deg,#1b2333,#1a1f2b);
      color:var(--text); border:1px solid var(--border); font-size:18px;
    }
    .row{display:grid;gap:12px}
    @media(min-width:700px){.row.two{grid-template-columns:1fr 1fr}}
    .pill{
      display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px;
      border:1px solid var(--border); color:var(--muted); margin-right:6px; margin-bottom:6px;
    }
    input[type=file], select, input[type=number]{
      width:100%; padding:13px 14px; border-radius:14px; border:1px solid var(--border);
      background:#0f1420; color:var(--text); font-size:16px;
    }
    .status{
      padding:12px 14px; border-radius:14px; background:#0f1420; border:1px solid var(--border);
      white-space:pre-wrap; line-height:1.5; min-height:56px;
    }
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
    progress{width:100%;height:14px;border-radius:999px;overflow:hidden;margin:10px 0 0}
    .download a{display:inline-block;margin-top:10px;color:#9ad0ff;font-weight:700;word-break:break-all}
    .mini{font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card hero">
      <h1>📱 動画変換アプリ Lite v3</h1>
      <p>MTS / M2TS / MOV / MP4 を MP4 に変換する版です。worker / core を同梱してあるので CORS を避けます。</p>
      <div style="margin-top:12px">
        <span class="pill">CORS対策済み</span>
        <span class="pill">ログ表示あり</span>
        <span class="pill">GitHub Pages対応</span>
      </div>
    </section>

    <section class="card">
      <h2>1. まず変換エンジンを読む</h2>
      <p class="mini">初回は大きめの読込があるので、Wi‑Fi推奨です。</p>
      <button id="loadBtn" class="btn">① エンジン読み込み</button>
      <progress id="loadProgress" max="100" value="0" style="display:none"></progress>
    </section>

    <section class="card">
      <h2>2. 動画を選ぶ</h2>
      <div class="row two">
        <div>
          <label for="fileInput">入力ファイル</label>
          <input id="fileInput" type="file" />
          <small id="fileInfo">未選択</small>
        </div>
        <div>
          <label for="preset">変換プリセット</label>
          <select id="preset">
            <option value="fast">できるだけ速く</option>
            <option value="balanced" selected>標準</option>
            <option value="small">容量小さめ</option>
            <option value="copy">再エンコードなしで試す</option>
          </select>
        </div>
      </div>
      <div class="row two" style="margin-top:12px">
        <div>
          <label for="fps">FPS上限（空欄でそのまま）</label>
          <input id="fps" type="number" min="1" max="60" inputmode="numeric" placeholder="例: 30" />
        </div>
        <div>
          <label for="scale">解像度</label>
          <select id="scale">
            <option value="keep" selected>そのまま</option>
            <option value="720">幅1280以下に縮小</option>
            <option value="540">幅960以下に縮小</option>
          </select>
        </div>
      </div>
      <button id="convertBtn" class="btn" disabled>② MP4に変換</button>
      <button id="testBtn" class="btn secondary">診断だけ実行する</button>
    </section>

    <section class="card">
      <h2>3. 状態</h2>
      <div id="status" class="status">待機中</div>
      <progress id="runProgress" max="100" value="0" style="display:none"></progress>
      <div id="download" class="download"></div>
    </section>
  </div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const loadBtn = document.getElementById('loadBtn');
    const convertBtn = document.getElementById('convertBtn');
    const testBtn = document.getElementById('testBtn');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const downloadEl = document.getElementById('download');
    const loadProgress = document.getElementById('loadProgress');
    const runProgress = document.getElementById('runProgress');

    let ffmpeg = null;
    let loaded = false;

    const log = (msg, cls='') => {
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
      statusEl.textContent = msg;
      console.log(msg);
    };
    const append = (msg) => {
      statusEl.textContent += '\\n' + msg;
      console.log(msg);
    };
    const setBusy = (busy) => {
      loadBtn.disabled = busy;
      convertBtn.disabled = busy || !loaded;
      testBtn.disabled = busy;
      fileInput.disabled = busy;
    };

    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      fileInfo.textContent = f ? `${f.name} / ${(f.size / 1024 / 1024).toFixed(1)} MB / ${f.type || 'type不明'}` : '未選択';
    });

    async function importFFmpegModule() {
      append('ライブラリ取得を開始…');
      try {
        return await import('./ffmpeg-esm.js');
      } catch (e1) {
        append('ローカルESM失敗。CDNを試行…');
        return await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
      }
    }

    async function importUtilModule() {
      try {
        return await import('./util-esm.js');
      } catch (e1) {
        return await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
      }
    }

    async function loadEngine() {
      if (loaded && ffmpeg) {
        log('すでに読み込み済みです。', 'ok');
        return;
      }
      setBusy(true);
      loadProgress.style.display = 'block';
      loadProgress.value = 8;
      log('タップを受け付けました。変換エンジンを読み込みます…');

      try {
        const [{ FFmpeg }, { toBlobURL }] = await Promise.all([
          importFFmpegModule(),
          importUtilModule()
        ]);
        append('モジュール読込OK');
        loadProgress.value = 25;

        ffmpeg = new FFmpeg();
        ffmpeg.on('log', ({ message }) => {
          if (message) {
            statusEl.textContent = (statusEl.textContent + '\\n' + message).split('\\n').slice(-14).join('\\n');
          }
        });
        ffmpeg.on('progress', ({ progress }) => {
          if (typeof progress === 'number') {
            runProgress.style.display = 'block';
            runProgress.value = Math.min(100, Math.max(0, progress * 100));
          }
        });

        const base = './';
        const wasmURL = await toBlobURL(base + 'ffmpeg-core.wasm', 'application/wasm');
        const coreURL = await toBlobURL(base + 'ffmpeg-core.js', 'text/javascript');
        const workerURL = await toBlobURL(base + 'worker.js', 'text/javascript');

        append('ローカルworker/coreを準備中…');
        loadProgress.value = 65;

        await ffmpeg.load({ coreURL, wasmURL, workerURL });

        loadProgress.value = 100;
        loaded = true;
        convertBtn.disabled = false;
        log('✅ 変換エンジンの読み込み完了', 'ok');
      } catch (e) {
        console.error(e);
        log(`❌ 読み込み失敗\\n${e?.message || e}`, 'err');
      } finally {
        setBusy(false);
        setTimeout(() => { loadProgress.style.display = 'none'; loadProgress.value = 0; }, 900);
      }
    }

    function buildArgs() {
      const preset = document.getElementById('preset').value;
      const fps = document.getElementById('fps').value.trim();
      const scale = document.getElementById('scale').value;
      const filters = [];

      if (fps) filters.push(`fps=${fps}`);
      if (scale === '720') filters.push("scale='min(1280,iw)':-2");
      if (scale === '540') filters.push("scale='min(960,iw)':-2");

      if (preset === 'copy') {
        return ['-i', 'input', '-c', 'copy', '-movflags', '+faststart', 'output.mp4'];
      }

      const args = ['-i', 'input'];
      if (filters.length) args.push('-vf', filters.join(','));

      if (preset === 'fast') {
        args.push('-c:v','libx264','-preset','ultrafast','-crf','31','-pix_fmt','yuv420p','-c:a','aac','-b:a','96k','-movflags','+faststart','output.mp4');
      } else if (preset === 'small') {
        args.push('-c:v','libx264','-preset','veryfast','-crf','33','-pix_fmt','yuv420p','-c:a','aac','-b:a','80k','-movflags','+faststart','output.mp4');
      } else {
        args.push('-c:v','libx264','-preset','veryfast','-crf','28','-pix_fmt','yuv420p','-c:a','aac','-b:a','128k','-movflags','+faststart','output.mp4');
      }
      return args;
    }

    async function runDiagnostic() {
      setBusy(true);
      log('診断開始…');
      try {
        await loadEngine();
        if (!ffmpeg || !loaded) throw new Error('エンジン未読込');
        append('簡易コマンド実行中…');
        await ffmpeg.exec(['-version']);
        log('✅ 診断OK。エンジンは動いています。', 'ok');
      } catch (e) {
        console.error(e);
        log(`❌ 診断失敗\\n${e?.message || e}`, 'err');
      } finally {
        setBusy(false);
      }
    }

    async function convertVideo() {
      const file = fileInput.files?.[0];
      if (!file) return log('❌ 先にファイルを選んでください。', 'err');
      if (!loaded || !ffmpeg) return log('❌ 先に①エンジン読み込みを押してください。', 'err');

      setBusy(true);
      downloadEl.innerHTML = '';
      runProgress.style.display = 'block';
      runProgress.value = 3;

      try {
        log(`入力: ${file.name}\\n書き込み中…`);
        const data = new Uint8Array(await file.arrayBuffer());
        await ffmpeg.writeFile('input', data);

        const args = buildArgs();
        append('変換開始…');
        append('$ ffmpeg ' + args.join(' '));
        await ffmpeg.exec(args);

        runProgress.value = 95;
        append('出力読込中…');
        const out = await ffmpeg.readFile('output.mp4');
        const blob = new Blob([out.buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = file.name.replace(/\.[^.]+$/, '') + '_converted.mp4';
        a.textContent = '⬇️ 変換後MP4をダウンロード';
        a.rel = 'noopener';

        downloadEl.innerHTML = '';
        downloadEl.appendChild(a);
        runProgress.value = 100;
        log('✅ 変換完了。下のリンクから保存してください。', 'ok');
      } catch (e) {
        console.error(e);
        log(`❌ 変換失敗\\n${e?.message || e}`, 'err');
      } finally {
        setBusy(false);
      }
    }

    loadBtn.addEventListener('click', loadEngine, { passive: true });
    convertBtn.addEventListener('click', convertVideo, { passive: true });
    testBtn.addEventListener('click', runDiagnostic, { passive: true });

    log('待機中\\nまず①エンジン読み込みを押してください。');
  </script>
</body>
</html>
