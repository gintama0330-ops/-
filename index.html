<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>きょうのきぶんルーム+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ffdff0;
      --bg2:#efe2ff;
      --bg3:#dff3ff;
      --card:#fff9fdcc;
      --text:#7b5c8f;
      --sub:#a587b8;
      --pink:#ff8fc5;
      --purple:#c7a4ff;
      --yellow:#ffe596;
      --shadow:0 20px 45px rgba(210,145,192,.22);
      --line:rgba(255,255,255,.9);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Zen Maru Gothic", system-ui, sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,184,219,.75), transparent 18%),
        radial-gradient(circle at 88% 15%, rgba(184,229,255,.9), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(204,248,227,.75), transparent 18%),
        linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    }

    .floaters{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }
    .floater{
      position:absolute;
      bottom:-12vh;
      opacity:.84;
      font-size:clamp(18px,3vw,30px);
      animation:up linear infinite;
      filter:drop-shadow(0 6px 8px rgba(255,255,255,.4));
      user-select:none;
    }
    @keyframes up{
      0%{transform:translateY(0) rotate(0deg);opacity:0}
      10%{opacity:.9}
      100%{transform:translateY(-118vh) rotate(16deg);opacity:0}
    }

    .wrap{
      position:relative;
      z-index:1;
      width:min(94vw, 520px);
      margin:0 auto;
      padding:22px 0 40px;
    }

    .hero-pill{
      width:100%;
      background:linear-gradient(135deg, rgba(255,255,255,.98), rgba(255,246,252,.92));
      border:3px solid var(--line);
      border-radius:999px;
      box-shadow:var(--shadow);
      padding:14px 18px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .hero-pill .tiny{font-size:20px;line-height:1}
    .hero-pill .title{
      font-family:"Mochiy Pop One", sans-serif;
      color:#ab78d9;
      font-size:clamp(20px,4.8vw,28px);
      letter-spacing:.02em;
    }

    .card,.info-card{
      position:relative;
      background:var(--card);
      backdrop-filter:blur(14px);
      border:3px solid var(--line);
      border-radius:34px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card{padding:18px 18px 22px}
    .info-card{padding:16px 16px 18px;margin-top:16px}

    .datebar{
      background:linear-gradient(135deg,#fff4b9,#ffd6e8);
      border:2px solid rgba(255,255,255,.9);
      border-radius:999px;
      padding:10px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      box-shadow:0 8px 18px rgba(255,214,232,.32);
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .date{font-size:13px;color:#8a6f99;font-weight:700}
    .fortune{
      display:flex;align-items:center;gap:8px;
      font-size:13px;font-weight:700;color:#8a6f99;
    }
    .stars{
      color:#ffbc1f;letter-spacing:2px;font-size:18px;
      text-shadow:0 2px 0 rgba(255,255,255,.7);
    }

    .stage{
      background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.42));
      border:2px dashed rgba(255,182,211,.9);
      border-radius:28px;
      padding:18px 14px 14px;
      text-align:center;
      box-shadow:inset 0 0 0 6px rgba(255,255,255,.25);
    }

    .spark-line{
      font-size:19px;letter-spacing:7px;color:#ff9fcf;margin-bottom:10px;opacity:.92;
    }

    .character-wrap{
      display:flex;align-items:flex-end;justify-content:center;gap:10px;
      min-height:170px;margin-bottom:12px;flex-wrap:wrap;
    }
    .character{
      width:104px;height:118px;position:relative;
      border-radius:48px 48px 42px 42px;
      background:linear-gradient(180deg, #fff8fc, #ffdce9);
      border:3px solid rgba(255,255,255,.95);
      box-shadow:0 12px 22px rgba(224,165,197,.22);
      animation:bob 3s ease-in-out infinite;
      cursor:pointer;user-select:none;transition:transform .2s ease;
    }
    .character:hover{transform:translateY(-3px)}
    .character.bear{background:linear-gradient(180deg,#fff6fb,#ffd8e8)}
    .character.rabbit{background:linear-gradient(180deg,#fff8ff,#f6e2ff)}
    .character.cat{background:linear-gradient(180deg,#f9fcff,#dff1ff)}
    .character::before,.character::after{
      content:"";position:absolute;width:34px;height:34px;top:-10px;
      background:inherit;border:3px solid rgba(255,255,255,.95);border-radius:50%;
    }
    .bear::before{left:8px}.bear::after{right:8px}
    .cat::before,.cat::after{
      width:28px;height:28px;top:-9px;border-radius:8px 18px 8px 18px;
    }
    .cat::before{left:12px;transform:rotate(-28deg)}
    .cat::after{right:12px;transform:rotate(28deg)}
    .rabbit::before,.rabbit::after{
      width:24px;height:52px;top:-30px;border-radius:20px 20px 12px 12px;
    }
    .rabbit::before{left:20px;transform:rotate(-12deg)}
    .rabbit::after{right:20px;transform:rotate(12deg)}

    .face{position:absolute;inset:0}
    .eye{
      position:absolute;width:10px;height:14px;background:#6f5c79;border-radius:50%;top:44px;
    }
    .eye.left{left:31px}.eye.right{right:31px}
    .blush{
      position:absolute;width:18px;height:10px;background:rgba(255,148,180,.42);
      border-radius:50%;top:62px;
    }
    .blush.left{left:18px}.blush.right{right:18px}
    .mouth{
      position:absolute;left:50%;top:63px;width:18px;height:10px;
      transform:translateX(-50%);
      border-bottom:3px solid #7b647c;border-radius:0 0 18px 18px;
    }
    .tiny-paw{
      position:absolute;bottom:10px;width:18px;height:14px;background:rgba(255,255,255,.55);border-radius:50%;
    }
    .tiny-paw.left{left:24px}.tiny-paw.right{right:24px}
    @keyframes bob{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-7px)}
    }

    .name-row{
      display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;
    }
    .chip,.news-tab{
      border:none;background:rgba(255,255,255,.86);
      border:2px solid rgba(255,255,255,.95);color:#9c78b7;
      border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;
      box-shadow:0 6px 14px rgba(217,174,216,.18);cursor:pointer;transition:.2s ease;
      font-family:inherit;
    }
    .chip.active,.news-tab.active{
      background:linear-gradient(135deg,#ffb7db,#d8b7ff);color:#fff;
    }

    .message{
      min-height:94px;display:grid;place-items:center;padding:14px 12px;
      background:rgba(255,255,255,.72);border:2px solid rgba(255,255,255,.9);
      border-radius:24px;color:#7b5d8c;line-height:1.9;font-size:16px;margin:10px 0 14px;
      text-align:center;
    }

    .main-btn,.ghost-btn{
      width:100%;border:none;border-radius:999px;padding:15px 18px;
      color:#fff;font-size:16px;font-weight:700;font-family:inherit;
      box-shadow:0 12px 22px rgba(214,140,206,.32);cursor:pointer;transition:.18s ease;
    }
    .main-btn{background:linear-gradient(135deg,var(--pink),var(--purple))}
    .ghost-btn{
      background:linear-gradient(135deg,#9fdcff,#bfa9ff);
      margin-top:10px;
    }
    .main-btn:hover,.ghost-btn:hover{transform:translateY(-2px) scale(1.01);filter:brightness(1.03)}
    .main-btn:active,.ghost-btn:active{transform:scale(.98)}

    .mini-deco{margin-top:8px;text-align:center;font-size:18px;letter-spacing:4px;color:#ff98c3}
    .subtext{margin-top:13px;text-align:center;font-size:12px;line-height:1.7;color:var(--sub)}

    .section-head{
      display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;
    }
    .section-title{
      font-family:"Mochiy Pop One", sans-serif;
      color:#ab78d9;font-size:18px;
    }
    .tiny-note{font-size:12px;color:var(--sub)}

    .weather-box{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:14px;
      align-items:center;
      background:linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,248,253,.62));
      border:2px solid rgba(255,255,255,.92);
      border-radius:24px;
      padding:14px;
    }
    .weather-emoji{
      width:96px;height:96px;border-radius:26px;
      display:grid;place-items:center;
      font-size:42px;
      background:linear-gradient(180deg,#fff7bf,#ffe7f0);
      box-shadow:0 10px 18px rgba(255,211,120,.18);
    }
    .weather-main{
      font-size:28px;font-weight:700;color:#7a5c8d;line-height:1.2;
    }
    .weather-desc{font-size:14px;color:#9478a6;margin-top:3px}
    .weather-grid{
      display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;
    }
    .mini-box{
      background:rgba(255,255,255,.72);
      border:2px solid rgba(255,255,255,.9);
      border-radius:18px;
      padding:10px 12px;
    }
    .mini-label{font-size:11px;color:var(--sub);margin-bottom:5px}
    .mini-value{font-size:15px;font-weight:700;color:#7a5c8d}

    .news-tabs{
      display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;
    }
    .news-list{
      display:grid;gap:10px;
    }
    .news-item{
      display:block;
      text-decoration:none;
      background:linear-gradient(135deg, rgba(255,255,255,.78), rgba(248,250,255,.66));
      border:2px solid rgba(255,255,255,.92);
      border-radius:20px;
      padding:12px 14px;
      color:#7a5c8d;
      box-shadow:0 8px 18px rgba(195,178,226,.12);
      transition:.18s ease;
    }
    .news-item:hover{transform:translateY(-2px)}
    .news-kicker{font-size:11px;color:#a08bb1;margin-bottom:5px}
    .news-title{font-size:14px;line-height:1.7;font-weight:700}
    .loading{
      background:rgba(255,255,255,.66);
      border:2px dashed rgba(255,255,255,.92);
      border-radius:20px;
      padding:18px;
      text-align:center;
      color:#9c84af;
    }
    .error{
      background:rgba(255,255,255,.66);
      border:2px dashed rgba(255,182,182,.9);
      border-radius:20px;
      padding:16px;
      color:#b06c7d;
      line-height:1.8;
    }

    @media (max-width:460px){
      .character-wrap{gap:8px}
      .character{width:92px;height:108px}
      .eye{top:40px}
      .mouth{top:59px}
      .message{font-size:15px}
      .weather-box{grid-template-columns:1fr; text-align:center}
      .weather-emoji{margin:0 auto}
    }
  </style>
</head>
<body>
  <div class="floaters" id="floaters"></div>

  <main class="wrap">
    <div class="hero-pill">
      <span class="tiny">🎀</span>
      <div class="title">きょうのきぶんルーム</div>
      <span class="tiny">✨</span>
    </div>

    <section class="card">
      <div class="datebar">
        <div class="date" id="dateText">2026年4月19日（日）</div>
        <div class="fortune">
          <span>きょうの運勢</span>
          <span class="stars" id="starText">⭐⭐</span>
        </div>
      </div>

      <div class="stage">
        <div class="spark-line">✦ ⋆ ୨୧ ˚ ✦</div>

        <div class="character-wrap">
          <div class="character bear">
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
              <div class="tiny-paw left"></div>
              <div class="tiny-paw right"></div>
            </div>
          </div>

          <div class="character rabbit">
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
              <div class="tiny-paw left"></div>
              <div class="tiny-paw right"></div>
            </div>
          </div>

          <div class="character cat">
            <div class="face">
              <div class="eye left"></div>
              <div class="eye right"></div>
              <div class="blush left"></div>
              <div class="blush right"></div>
              <div class="mouth"></div>
              <div class="tiny-paw left"></div>
              <div class="tiny-paw right"></div>
            </div>
          </div>
        </div>

        <div class="name-row">
          <button class="chip active" data-char="0">もこくま</button>
          <button class="chip" data-char="1">みるうさ</button>
          <button class="chip" data-char="2">そらねこ</button>
        </div>

        <div class="message" id="message">
          こんにちは〜！<br>
          今日はどんな気分かな？ 💭
        </div>

        <button class="main-btn" id="mainBtn">きょうのメッセージをみる</button>
        <button class="ghost-btn" id="jumpBtn">↓ きょうの天気とニュースを見る</button>
      </div>

      <div class="mini-deco">💖 ⭐ ☁️ 🎀</div>
      <div class="subtext">
        きょうは「がんばる」より<br>
        「かわいく生きる」を優先してよし
      </div>
    </section>

    <section class="info-card" id="weatherSection">
      <div class="section-head">
        <div class="section-title">横浜のきょうの天気</div>
        <div class="tiny-note">自動で更新</div>
      </div>

      <div id="weatherContent" class="loading">天気をよみこみ中… ☁️</div>
    </section>

    <section class="info-card" id="newsSection">
      <div class="section-head">
        <div class="section-title">きょうのニュース</div>
        <div class="tiny-note">タップで開く</div>
      </div>

      <div class="news-tabs">
        <button class="news-tab active" data-mode="guardian">世界</button>
        <button class="news-tab" data-mode="japan">日本</button>
        <button class="news-tab" data-mode="hn">IT</button>
      </div>

      <div id="newsContent" class="loading">ニュースをよみこみ中… 📰</div>
    </section>
  </main>

  <script>
    const floaters = document.getElementById('floaters');
    const floaterIcons = ['✨','💖','⭐','☁️','🎀','🫧'];
    for(let i=0;i<26;i++){
      const el = document.createElement('div');
      el.className = 'floater';
      el.textContent = floaterIcons[Math.floor(Math.random()*floaterIcons.length)];
      el.style.left = (Math.random()*100) + '%';
      el.style.animationDuration = (8 + Math.random()*10) + 's';
      el.style.animationDelay = (Math.random()*8) + 's';
      el.style.fontSize = (18 + Math.random()*14) + 'px';
      floaters.appendChild(el);
    }

    const charMessages = {
      0: [
        'もこくまからひとこと🧸<br>今日はあせらなくてだいじょうぶ。',
        'もこくまより💖<br>ちょっと休みつつ進めば100点だよ。',
        'もこくまとまったり☁️<br>自分にやさしい予定でいこう。'
      ],
      1: [
        'みるうさより🎀<br>今日はふわっと可愛く過ごせば勝ち。',
        'みるうさからの運気🌷<br>小さなごほうびをあげてね。',
        'みるうさより✨<br>ゆっくりでも前に進んでるよ。'
      ],
      2: [
        'そらねこより⭐<br>今日は気分で選んでもいい日かも。',
        'そらねこから🫧<br>なんか違う、の感覚を大事にしてね。',
        'そらねこより☁️<br>無理に元気じゃなくても大丈夫。'
      ]
    };

    let activeChar = 0;
    const chips = [...document.querySelectorAll('.chip')];
    const messageEl = document.getElementById('message');

    function setCharacter(index){
      activeChar = index;
      chips.forEach((chip,i)=>chip.classList.toggle('active', i===index));
    }
    chips.forEach((chip,i)=> chip.addEventListener('click', ()=> setCharacter(i)));
    document.getElementById('mainBtn').addEventListener('click', ()=>{
      const arr = charMessages[activeChar];
      const text = arr[Math.floor(Math.random()*arr.length)];
      messageEl.innerHTML = text;
    });
    document.getElementById('jumpBtn').addEventListener('click', ()=>{
      document.getElementById('weatherSection').scrollIntoView({behavior:'smooth'});
    });

    const today = new Date();
    const weekdays = ['日','月','火','水','木','金','土'];
    document.getElementById('dateText').textContent =
      `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日（${weekdays[today.getDay()]}）`;
    document.getElementById('starText').textContent = '⭐'.repeat((today.getDate() % 3) + 1);
    setCharacter(0);

    function codeToEmoji(code){
      if ([0].includes(code)) return '☀️';
      if ([1].includes(code)) return '🌤️';
      if ([2,3].includes(code)) return '☁️';
      if ([45,48].includes(code)) return '🌫️';
      if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return '🌧️';
      if ([71,73,75,77,85,86].includes(code)) return '❄️';
      if ([95,96,99].includes(code)) return '⛈️';
      return '🌈';
    }
    function codeToText(code){
      if (code === 0) return 'よく晴れ';
      if (code === 1) return 'おおむね晴れ';
      if (code === 2) return 'くもりがち';
      if (code === 3) return 'くもり';
      if ([45,48].includes(code)) return '霧';
      if ([51,53,55,56,57].includes(code)) return '霧雨';
      if ([61,63,65,66,67,80,81,82].includes(code)) return '雨';
      if ([71,73,75,77,85,86].includes(code)) return '雪';
      if ([95,96,99].includes(code)) return '雷雨';
      return '天気';
    }

    async function loadWeather(){
      const target = document.getElementById('weatherContent');
      try{
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=35.4437&longitude=139.6380&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=1';
        const res = await fetch(url);
        const data = await res.json();

        const current = data.current || {};
        const daily = data.daily || {};
        const code = current.weather_code ?? 0;
        const emoji = codeToEmoji(code);
        const desc = codeToText(code);

        target.className = '';
        target.innerHTML = `
          <div class="weather-box">
            <div class="weather-emoji">${emoji}</div>
            <div>
              <div class="weather-main">${Math.round(current.temperature_2m ?? 0)}℃</div>
              <div class="weather-desc">横浜市 / ${desc}</div>
            </div>
          </div>
          <div class="weather-grid">
            <div class="mini-box">
              <div class="mini-label">最高 / 最低</div>
              <div class="mini-value">${Math.round((daily.temperature_2m_max || [0])[0])}℃ / ${Math.round((daily.temperature_2m_min || [0])[0])}℃</div>
            </div>
            <div class="mini-box">
              <div class="mini-label">降水確率</div>
              <div class="mini-value">${(daily.precipitation_probability_max || [0])[0]}%</div>
            </div>
            <div class="mini-box">
              <div class="mini-label">体感温度</div>
              <div class="mini-value">${Math.round(current.apparent_temperature ?? 0)}℃</div>
            </div>
            <div class="mini-box">
              <div class="mini-label">風速</div>
              <div class="mini-value">${Math.round(current.wind_speed_10m ?? 0)} km/h</div>
            </div>
          </div>
        `;
      }catch(e){
        target.className = 'error';
        target.innerHTML = '天気の取得に失敗したよ。<br>時間をおいてもう一度ひらいてみてね。';
      }
    }

    const tabButtons = [...document.querySelectorAll('.news-tab')];
    const newsContent = document.getElementById('newsContent');

    async function loadGuardian(){
      const apiKey = 'test';
      const url = `https://content.guardianapis.com/search?api-key=${apiKey}&page-size=5&show-fields=trailText&order-by=newest`;
      const res = await fetch(url);
      const data = await res.json();
      const items = data.response?.results || [];
      return items.map((item, idx) => ({
        kicker: `WORLD ${idx + 1}`,
        title: item.webTitle,
        link: item.webUrl
      }));
    }

    async function loadHackerNews(){
      const url = 'https://hn.algolia.com/api/v1/search?tags=front_page';
      const res = await fetch(url);
      const data = await res.json();
      const items = data.hits || [];
      return items.slice(0,5).map((item, idx) => ({
        kicker: `IT ${idx + 1}`,
        title: item.title || item.story_title || 'No title',
        link: item.url || item.story_url || 'https://news.ycombinator.com/'
      }));
    }

    async function loadJapanFallback(){
      const queries = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www3.nhk.or.jp/rss/news/cat0.xml'),
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.asahi.com/rss/asahi/newsheadlines.rdf')
      ];

      for (const url of queries){
        try{
          const res = await fetch(url);
          const text = await res.text();
          const xml = new DOMParser().parseFromString(text, 'text/xml');
          const items = [...xml.querySelectorAll('item')].slice(0,5);
          if (items.length){
            return items.map((item, idx) => ({
              kicker: `JAPAN ${idx + 1}`,
              title: item.querySelector('title')?.textContent || 'No title',
              link: item.querySelector('link')?.textContent || '#'
            }));
          }
        }catch(e){}
      }
      throw new Error('Japan news unavailable');
    }

    async function loadNews(mode = 'guardian'){
      tabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      newsContent.className = 'loading';
      newsContent.innerHTML = 'ニュースをよみこみ中… 📰';

      try{
        let items = [];
        if (mode === 'guardian') items = await loadGuardian();
        if (mode === 'hn') items = await loadHackerNews();
        if (mode === 'japan') items = await loadJapanFallback();

        if (!items.length) throw new Error('No news');

        newsContent.className = 'news-list';
        newsContent.innerHTML = items.map((item) => `
          <a class="news-item" href="${item.link}" target="_blank" rel="noopener noreferrer">
            <div class="news-kicker">${item.kicker}</div>
            <div class="news-title">${item.title}</div>
          </a>
        `).join('');
      }catch(e){
        newsContent.className = 'error';
        newsContent.innerHTML = 'ニュースの取得に失敗したよ。<br>別のタブを押すと読めることがあるよ。';
      }
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => loadNews(btn.dataset.mode));
    });

    loadWeather();
    loadNews('guardian');
  </script>
</body>
</html>
