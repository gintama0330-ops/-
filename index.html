<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>きょうのきぶんルーム</title>

<style>
body{
  margin:0;
  font-family:"Hiragino Maru Gothic ProN",sans-serif;
  background:linear-gradient(180deg,#ffeef5,#f3e8ff,#e0f2ff);
  overflow:hidden;
}

/* キラキラ背景 */
.sparkle{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
}

.sparkle span{
  position:absolute;
  font-size:20px;
  animation:float 10s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* メインカード */
.card{
  position:relative;
  margin:60px auto;
  width:90%;
  max-width:400px;
  padding:25px;
  background:rgba(255,255,255,0.85);
  border-radius:30px;
  text-align:center;
  box-shadow:0 20px 50px rgba(255,150,200,0.3);
  backdrop-filter:blur(10px);
}

/* タイトル */
h1{
  color:#a855f7;
  font-size:24px;
  margin-bottom:10px;
}

/* 日付 */
#date{
  color:#777;
  margin-bottom:10px;
}

/* 運勢 */
#fortune{
  font-size:18px;
  margin-bottom:15px;
}

.star{
  color:#fbbf24;
  font-size:24px;
}

/* キャラ */
.character{
  font-size:70px;
  margin:20px 0;
  cursor:pointer;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

/* メッセージ */
#msg{
  min-height:50px;
  margin:15px 0;
  color:#555;
}

/* ボタン */
button{
  padding:12px 20px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff9fcf,#c084fc);
  color:white;
  font-size:16px;
  margin-top:10px;
  box-shadow:0 8px 20px rgba(255,150,200,0.4);
}

button:active{
  transform:scale(0.95);
}
</style>
</head>

<body>

<!-- キラキラ -->
<div class="sparkle" id="sparkle"></div>

<div class="card">

<h1>きょうのきぶんルーム ✨</h1>

<p id="date"></p>

<div id="fortune"></div>

<div class="character" onclick="changeCharacter()" id="chara">🐰</div>

<p id="msg">きょうの気分をチェックしよ〜 💖</p>

<button onclick="show()">メッセージを見る</button>

</div>

<script>

// キラキラ生成
const sparkle = document.getElementById("sparkle");
for(let i=0;i<20;i++){
  const s=document.createElement("span");
  s.innerText=["✨","💖","⭐","🎀"][Math.floor(Math.random()*4)];
  s.style.left=Math.random()*100+"%";
  s.style.animationDuration=(5+Math.random()*10)+"s";
  sparkle.appendChild(s);
}

// キャラ
const chars=["🐰","🐻","🐱","🐶","🐹","🦊"];
let index=0;

function changeCharacter(){
  index=(index+1)%chars.length;
  document.getElementById("chara").innerText=chars[index];
}

// メッセージ
const messages=[
"今日はゆっくりでOK 🌷",
"ちょっとでも進めばえらい 💖",
"無理しないのが一番 ☁️",
"自分に優しくしていい日 🎀",
"いいことちょっと起きる予感 ✨",
"今日は運いい日かも 👀"
];

function show(){
  const m=messages[Math.floor(Math.random()*messages.length)];
  document.getElementById("msg").innerText=m;
}

// 初期表示
function init(){
  const today=new Date();
  const day=today.getDate();

  document.getElementById("date").innerText=
    `${today.getMonth()+1}月${day}日`;

  // 運勢（★1〜3）
  const luck=(day%3)+1;

  let stars="";
  for(let i=0;i<luck;i++){
    stars+="⭐";
  }

  document.getElementById("fortune").innerHTML=
    `今日の運勢：<span class="star">${stars}</span>`;
}

init();

</script>

</body>
</html>
