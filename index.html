<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>きょうのきぶんルーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Zen Maru Gothic", sans-serif;
      background: linear-gradient(180deg, #fff7fb, #fdf2ff, #eef9ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #6b5177;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 300px;
    }
    h1 {
      font-family: "Mochiy Pop One";
      font-size: 20px;
    }
    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: pink;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>きょうのきぶんルーム</h1>
    <p id="msg">ボタンを押してね</p>
    <button onclick="showMood()">メッセージ</button>
  </div>

  <script>
    const messages = [
      "今日はゆっくりでOK 🌷",
      "ちょっとでも進めばえらい 💖",
      "無理しないのが一番 ☁️",
      "自分に優しくしていい日 🎀",
      "だらだらしてもOK 🍰"
    ];
    function showMood(){
      const msg = messages[Math.floor(Math.random()*messages.length)];
      document.getElementById("msg").innerText = msg;
    }
  </script>
</body>
</html>
